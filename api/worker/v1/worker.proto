syntax = "proto3";

package flexraid.worker.v1;

option go_package = "github.com/tetsup/flexraid/api/worker/v1;workerv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// WorkerService exposes monitoring APIs for one logical drive.
// It intentionally excludes file and namespace mutation operations.
service WorkerService {
  rpc GetStatus(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc GetDetailedStatus(google.protobuf.Empty) returns (google.protobuf.Struct);
  rpc Inspect(google.protobuf.Empty) returns (google.protobuf.Struct);
}
