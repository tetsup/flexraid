name: Format Go code

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  format:
    name: Format Go code
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Execute gofmt
        run: find . -type f -name '*.go' -print0 | xargs -0 -r gofmt -w

      - name: Verify formatting did not modify files
        run: |
          if ! git diff --quiet; then
            echo "::error::gofmt changed files. Run gofmt and commit the result."
            git diff
            exit 1
          fi
