name: Storage I/O Size Comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/storage-io-size.yml"
      - "benchmark/**"
      - "main/**"
      - "management/**"
      - "api/worker/v1/**"
      - "distribution/**"
      - "orchestration/**"
      - "io/**"
      - "platform/**"
      - "pkg/shared/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Raw ext4 vs FlexRAID FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchmark and FUSE tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 e2fsprogs

      - name: Build Worker
        run: |
          mkdir -p bin benchmark-results
          go build -o bin/flexraid ./main

      - name: Create four independent ext4 loopback drives
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe fuse
          sudo modprobe loop
          sudo mkdir -p /dev/disk/by-id
          : > "$RUNNER_TEMP/flexraid-bench-loops"
          : > "$RUNNER_TEMP/flexraid-bench-mounts"
          : > "$RUNNER_TEMP/flexraid-bench-links"
          for index in 1 2 3 4; do
            image="$RUNNER_TEMP/flexraid-bench-disk-$index.img"
            if [[ "$index" == "1" ]]; then truncate -s 5G "$image"; else truncate -s 4G "$image"; fi
            loop="$(sudo losetup --find --show "$image")"
            echo "$loop" >> "$RUNNER_TEMP/flexraid-bench-loops"
            sudo mkfs.ext4 -F -q "$loop"
            mount="/mnt/flexraid-bench-disk-$index"
            link="/dev/disk/by-id/wwn-flexraid-bench-$index"
            sudo mkdir -p "$mount"
            sudo mount "$loop" "$mount"
            echo "$mount" >> "$RUNNER_TEMP/flexraid-bench-mounts"
            sudo ln -s "$loop" "$link"
            echo "$link" >> "$RUNNER_TEMP/flexraid-bench-links"
            sudo mkdir -p "$mount/flexraid-data"
          done

      - name: Run raw directory benchmark five times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3 4 5; do
            echo "===== Raw benchmark iteration $iteration/5 ====="
            sudo ./bin/flexraid benchmark raw \
              --directory /mnt/flexraid-bench-disk-1 \
              --reference-bytes 805306368 \
              --max-files 256 \
              --output "$GITHUB_WORKSPACE/benchmark-results/raw/run-$iteration"
            sudo fstrim -v /mnt/flexraid-bench-disk-1
          done

      - name: Run FlexRAID benchmark five times
        shell: bash
        run: |
          set -euo pipefail
          worker_config="$RUNNER_TEMP/flexraid-bench.yaml"
          cat > "$worker_config" <<YAML
          disks:
            - root: /mnt/flexraid-bench-disk-1/flexraid-data
              mountpoint: /mnt/flexraid-bench-disk-1
              wwn: flexraid-bench-1
            - root: /mnt/flexraid-bench-disk-2/flexraid-data
              mountpoint: /mnt/flexraid-bench-disk-2
              wwn: flexraid-bench-2
            - root: /mnt/flexraid-bench-disk-3/flexraid-data
              mountpoint: /mnt/flexraid-bench-disk-3
              wwn: flexraid-bench-3
            - root: /mnt/flexraid-bench-disk-4/flexraid-data
              mountpoint: /mnt/flexraid-bench-disk-4
              wwn: flexraid-bench-4
          mountpoint: $RUNNER_TEMP/flexraid-production-mountpoint
          grpc_socket_path: $RUNNER_TEMP/flexraid-bench.sock
          grpc_enabled: true
          YAML
          for iteration in 1 2 3 4 5; do
            echo "===== FlexRAID benchmark iteration $iteration/5 ====="
            sudo ./bin/flexraid benchmark \
              --config "$worker_config" \
              --reference-bytes 805306368 \
              --max-files 256 \
              --output "$GITHUB_WORKSPACE/benchmark-results/flexraid/run-$iteration"
            for disk in 1 2 3 4; do
              sudo fstrim -v "/mnt/flexraid-bench-disk-$disk"
            done
          done
          sudo chown -R "$USER:$USER" benchmark-results

      - name: Calculate five-run averages
        run: |
          python3 - <<'PY'
          import csv
          import glob
          import os
          from collections import defaultdict

          root = "benchmark-results"
          for filesystem in ("raw", "flexraid"):
              rows = defaultdict(list)
              for path in sorted(glob.glob(f"{root}/{filesystem}/run-*/summary.csv")):
                  with open(path, newline="") as stream:
                      for row in csv.DictReader(stream):
                          key = (row["filesystem"], row["io_size_bytes"], row["label"], row["direction"])
                          rows[key].append(row)

              output = []
              for key, values in sorted(rows.items()):
                  if len(values) != 5:
                      raise SystemExit(f"{filesystem} {key}: expected 5 runs, got {len(values)}")
                  numeric = ("elapsed_seconds", "operations", "bytes", "bw_bytes_per_sec", "iops")
                  averaged = dict(zip(("filesystem", "io_size_bytes", "label", "direction"), key))
                  for field in numeric:
                      averaged[field] = str(sum(float(value[field]) for value in values) / 5)
                  output.append(averaged)

              destination = f"{root}/{filesystem}/average.csv"
              with open(destination, "w", newline="") as stream:
                  writer = csv.DictWriter(stream, fieldnames=(
                      "filesystem", "io_size_bytes", "label", "direction",
                      "elapsed_seconds", "operations", "bytes", "bw_bytes_per_sec", "iops"))
                  writer.writeheader()
                  writer.writerows(output)

              with open(f"{root}/{filesystem}/average.md", "w") as stream:
                  stream.write("| I/O size | Direction | Avg elapsed | Avg operations | Avg bytes | Avg bandwidth | Avg IOPS |\n")
                  stream.write("|---|---|---:|---:|---:|---:|---:|\n")
                  for row in output:
                      stream.write(
                          f"| {row['label']} | {row['direction']} | {float(row['elapsed_seconds']):.3f}s "
                          f"| {float(row['operations']):.1f} | {float(row['bytes']):.1f} "
                          f"| {float(row['bw_bytes_per_sec']) / (1024*1024):.2f} MiB/s "
                          f"| {float(row['iops']):.2f} |\n")
          PY

      - name: Upload benchmark results and summary
        uses: actions/upload-artifact@v6
        with:
          name: storage-io-size-comparison
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30

      - name: Clean up loopback devices
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/flexraid-bench-mounts" ]]; then
            while IFS= read -r mount; do sudo umount "$mount"; done < "$RUNNER_TEMP/flexraid-bench-mounts"
          fi
          if [[ -f "$RUNNER_TEMP/flexraid-bench-links" ]]; then
            while IFS= read -r link; do sudo rm -f "$link"; done < "$RUNNER_TEMP/flexraid-bench-links"
          fi
          if [[ -f "$RUNNER_TEMP/flexraid-bench-loops" ]]; then
            while IFS= read -r loop; do sudo losetup -d "$loop"; done < "$RUNNER_TEMP/flexraid-bench-loops"
          fi
