name: xfstests go-fuse Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  xfstests:
    name: go-fuse baseline shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out flexraid
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check out xfstests
        uses: actions/checkout@v6
        with:
          repository: kdave/xfstests
          path: xfstests
          ref: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake bc gawk libaio-dev libattr1-dev libcap-dev libgdbm-dev libgdbm-compat-dev liburing-dev xfslibs-dev libtool libtool-bin libuuid1 psmisc sed sqlite3 uuid-dev xfsprogs acl libacl1-dev attr quota python3 python3-pip fuse3

      - name: Build xfstests
        working-directory: xfstests
        run: |
          set -euxo pipefail
          make -j"$(nproc)" 2>&1 | tee ../xfstests-build.log
          test -x ltp/fsstress
          test -x ltp/fsx
          test -s tests/generic/group.list

      - name: Build go-fuse loopback baseline
        run: go build -o "$RUNNER_TEMP/gofuse-loopback" ./cmd/xfstests-gofuse

      - name: Prepare backing and test directories
        run: |
          set -eu
          root="$RUNNER_TEMP/gofuse-xfstests"
          mkdir -p "$root/backing" "$root/mount" "$root/scratch" "$root/results" "$root/logs"
          sudo chmod 0777 "$root" "$root/backing" "$root/mount" "$root/scratch" "$root/results" "$root/logs"

      - name: Configure xfstests mount lifecycle
        working-directory: xfstests
        run: |
          root="$RUNNER_TEMP/gofuse-xfstests"
          cat > local.config <<EOF
          export TEST_DIR="$root/mount"
          export TEST_DEV=gofuse-loopback
          export SCRATCH_DIR="$root/scratch"
          export FSTYP=fuse
          export RESULTS_DIR="$root/results"
          export GOFUSE_BIN="$RUNNER_TEMP/gofuse-loopback"
          export GOFUSE_BACKING_DIR="$root/backing"
          export GOFUSE_PID_FILE="$root/gofuse.pid"
          export GOFUSE_LOG="$root/logs/gofuse-loopback.log"
          EOF
          printf '\n# go-fuse baseline mount lifecycle (injected by CI).\nif [ -n "${GOFUSE_PID_FILE:-}" ]; then\n  . "$GITHUB_WORKSPACE/.github/xfstests/gofuse.rc"\nfi\n' >> common/rc

      - name: Select generic auto tests for this shard
        working-directory: xfstests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          set -euo pipefail
          test_list="$RUNNER_TEMP/xfstests-gofuse-shard-tests.txt"
          awk -v shard="$SHARD_INDEX" -v count="$SHARD_COUNT" '
            {
              sub(/[[:space:]]*#.*/, "")
              if (NF < 2) next
              is_auto = 0
              for (i = 2; i <= NF; i++) if ($i == "auto") is_auto = 1
              if (is_auto && selected++ % count == shard) print "generic/" $1
            }
          ' tests/generic/group.list > "$test_list"
          test -s "$test_list"
          printf 'go-fuse shard %s/%s selected %s tests:\n' "$SHARD_INDEX" "$SHARD_COUNT" "$(wc -l < "$test_list")"
          cat "$test_list"
          echo "XFSTESTS_SHARD_TEST_LIST=$test_list" >> "$GITHUB_ENV"
          echo "XFSTESTS_SHARD_INDEX=$SHARD_INDEX" >> "$GITHUB_ENV"
          echo "XFSTESTS_SHARD_COUNT=$SHARD_COUNT" >> "$GITHUB_ENV"

      - name: Run generic tests as root
        working-directory: xfstests
        run: |
          set -euo pipefail
          source ./local.config
          sudo --preserve-env=TEST_DIR,TEST_DEV,SCRATCH_DIR,FSTYP,RESULTS_DIR,GOFUSE_BIN,GOFUSE_BACKING_DIR,GOFUSE_PID_FILE,GOFUSE_LOG,GITHUB_WORKSPACE,RUNNER_TEMP,XFSTESTS_SHARD_TEST_LIST,XFSTESTS_SHARD_INDEX,XFSTESTS_SHARD_COUNT \
            bash -c 'set -euo pipefail
              mapfile -t tests < "$XFSTESTS_SHARD_TEST_LIST"
              printf "Running go-fuse shard %s/%s (%s tests)\\n" "$XFSTESTS_SHARD_INDEX" "$XFSTESTS_SHARD_COUNT" "${#tests[@]}"
              set +e
              bash ./check "${tests[@]}" 2>&1 | tee "results/xfstests-gofuse-shard-${XFSTESTS_SHARD_INDEX}.log"
              test_status=${PIPESTATUS[0]}
              set -e
              echo "go-fuse shard ${XFSTESTS_SHARD_INDEX} exit status: $test_status"
              echo "$test_status" > "results/xfstests-gofuse-shard-${XFSTESTS_SHARD_INDEX}.exit-status"
              exit "$test_status"'

      - name: Stop go-fuse mount
        if: always()
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/gofuse-xfstests/gofuse.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/gofuse-xfstests/gofuse.pid")
            kill "$pid" 2>/dev/null || true
          fi
          if mountpoint -q "$RUNNER_TEMP/gofuse-xfstests/mount"; then
            fusermount3 -u "$RUNNER_TEMP/gofuse-xfstests/mount" || sudo umount "$RUNNER_TEMP/gofuse-xfstests/mount"
          fi
          echo "go-fuse baseline logs:"
          find "$RUNNER_TEMP/gofuse-xfstests/logs" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' 2>/dev/null | sort || true

      - name: Upload xfstests logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xfstests-gofuse-shard-${{ matrix.shard }}-results
          path: |
            xfstests/results/
            xfstests/local.config
            xfstests/common/rc
            xfstests-build.log
            ${{ runner.temp }}/xfstests-gofuse-shard-tests.txt
            ${{ runner.temp }}/gofuse-xfstests/logs/
          if-no-files-found: warn
          retention-days: 14
