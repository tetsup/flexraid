name: xfstests go-fuse Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  xfstests:
    name: go-fuse baseline shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out flexraid
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check out xfstests
        uses: actions/checkout@v6
        with:
          repository: kdave/xfstests
          path: xfstests
          ref: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake bc gawk libaio-dev libattr1-dev libcap-dev libgdbm-dev libgdbm-compat-dev liburing-dev xfslibs-dev libtool libtool-bin libuuid1 psmisc sed sqlite3 uuid-dev xfsprogs acl libacl1-dev attr quota python3 python3-pip fuse3

      - name: Build xfstests
        working-directory: xfstests
        run: |
          set -euxo pipefail
          make -j"$(nproc)" 2>&1 | tee ../xfstests-build.log
          test -x ltp/fsstress
          test -x ltp/fsx
          test -s tests/generic/group.list

      - name: Build go-fuse loopback baseline
        run: go build -o "$RUNNER_TEMP/gofuse-loopback" ./cmd/xfstests-gofuse

      - name: Prepare backing and test directories
        run: |
          set -eu
          root="$RUNNER_TEMP/gofuse-xfstests"
          mkdir -p "$root/test-backing" "$root/scratch-backing" "$root/mount" "$root/scratch-mount" "$root/results" "$root/logs"
          sudo chmod 0777 "$root" "$root/test-backing" "$root/scratch-backing" "$root/mount" "$root/scratch-mount" "$root/results" "$root/logs"
          mkdir -p xfstests/results

      - name: Configure xfstests mount lifecycle
        working-directory: xfstests
        run: |
          root="$RUNNER_TEMP/gofuse-xfstests"
          cat > local.config <<EOF
          export TEST_DIR="$root/mount"
          export TEST_DEV="$root/test-backing"
          export SCRATCH_DEV="$root/scratch-backing"
          export SCRATCH_MNT="$root/scratch-mount"
          export FSTYP=fuse
          export FUSE_SUBTYP=.gofuse-loopback
          export RESULT_BASE="$PWD/results/"
          export GOFUSE_BIN="$RUNNER_TEMP/gofuse-loopback"
          export GOFUSE_BACKING_DIR="$root/test-backing"
          export GOFUSE_PID_FILE="$root/gofuse.pid"
          export GOFUSE_LOG="$root/logs/gofuse-loopback.log"
          export GOFUSE_SCRATCH_BACKING_DIR="$root/scratch-backing"
          export GOFUSE_SCRATCH_PID_FILE="$root/gofuse-scratch.pid"
          export GOFUSE_SCRATCH_LOG="$root/logs/gofuse-scratch.log"
          EOF
          printf '\n# go-fuse baseline mount lifecycle (injected by CI).\nif [ -n "${GOFUSE_PID_FILE:-}" ]; then\n  . "$GITHUB_WORKSPACE/.github/xfstests/gofuse.rc"\nfi\n' >> common/rc

      - name: Select generic auto tests for this shard
        working-directory: xfstests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          set -euo pipefail
          test_list="$RUNNER_TEMP/xfstests-gofuse-shard-tests.txt"
          awk -v shard="$SHARD_INDEX" -v count="$SHARD_COUNT" '
            {
              sub(/[[:space:]]*#.*/, "")
              if (NF < 2) next
              is_auto = 0
              for (i = 2; i <= NF; i++) if ($i == "auto") is_auto = 1
              if (is_auto && selected++ % count == shard) print "generic/" $1
            }
          ' tests/generic/group.list > "$test_list"
          test -s "$test_list"
          printf 'go-fuse shard %s/%s selected %s tests:\n' "$SHARD_INDEX" "$SHARD_COUNT" "$(wc -l < "$test_list")"
          cat "$test_list"
          echo "XFSTESTS_SHARD_TEST_LIST=$test_list" >> "$GITHUB_ENV"
          echo "XFSTESTS_SHARD_INDEX=$SHARD_INDEX" >> "$GITHUB_ENV"
          echo "XFSTESTS_SHARD_COUNT=$SHARD_COUNT" >> "$GITHUB_ENV"

      - name: Run generic tests as root
        working-directory: xfstests
        run: |
          set -euo pipefail
          source ./local.config
          sudo --preserve-env=TEST_DIR,TEST_DEV,SCRATCH_DEV,SCRATCH_MNT,FSTYP,RESULT_BASE,GOFUSE_BIN,GOFUSE_BACKING_DIR,GOFUSE_PID_FILE,GOFUSE_LOG,GOFUSE_SCRATCH_BACKING_DIR,GOFUSE_SCRATCH_PID_FILE,GOFUSE_SCRATCH_LOG,GITHUB_WORKSPACE,RUNNER_TEMP,XFSTESTS_SHARD_TEST_LIST,XFSTESTS_SHARD_INDEX,XFSTESTS_SHARD_COUNT \
            bash -c 'set -euo pipefail
              mapfile -t tests < "$XFSTESTS_SHARD_TEST_LIST"
              printf "Running go-fuse shard %s/%s (%s tests)\\n" "$XFSTESTS_SHARD_INDEX" "$XFSTESTS_SHARD_COUNT" "${#tests[@]}"
              set +e
              if [ "$XFSTESTS_SHARD_INDEX" = "0" ]; then
                bash -x ./check "${tests[@]}" 2>&1 | tee "results/xfstests-gofuse-shard-${XFSTESTS_SHARD_INDEX}.log"
              else
                bash ./check "${tests[@]}" 2>&1 | tee "results/xfstests-gofuse-shard-${XFSTESTS_SHARD_INDEX}.log"
              fi
              test_status=${PIPESTATUS[0]}
              set -e
              echo "go-fuse shard ${XFSTESTS_SHARD_INDEX} exit status: $test_status"
              echo "$test_status" > "results/xfstests-gofuse-shard-${XFSTESTS_SHARD_INDEX}.exit-status"
              echo "xfstests result inventory:"
              find results -maxdepth 2 -type f -printf "%p (%s bytes)\\n" | sort | tail -80
              exit "$test_status"'

      - name: Stop go-fuse mount
        if: always()
        run: |
          set +e
          root="$RUNNER_TEMP/gofuse-xfstests"
          for mount_dir in "$root/scratch-mount" "$root/mount"; do
            if mountpoint -q "$mount_dir"; then
              fusermount3 -u "$mount_dir" || sudo umount "$mount_dir"
            fi
          done
          for pid_file in "$root/gofuse-scratch.pid" "$root/gofuse.pid"; do
            if [ -f "$pid_file" ]; then
              pid=$(cat "$pid_file")
              for attempt in $(seq 1 10); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill "$pid" 2>/dev/null || true
              rm -f "$pid_file"
            fi
          done
          echo "go-fuse baseline logs:"
          find "$RUNNER_TEMP/gofuse-xfstests/logs" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' 2>/dev/null | sort || true

      - name: Upload xfstests logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xfstests-gofuse-shard-${{ matrix.shard }}-results
          path: |
            xfstests/results/
            xfstests/local.config
            xfstests/common/rc
            xfstests/check.out
            xfstests-build.log
            ${{ runner.temp }}/xfstests-gofuse-shard-tests.txt
            ${{ runner.temp }}/gofuse-xfstests/logs/
          if-no-files-found: warn
          retention-days: 14
