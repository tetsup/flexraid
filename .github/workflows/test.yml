name: Go Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request or dispatched ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests and report statement coverage
        shell: bash
        run: |
          set +e
          go test -coverprofile=coverage.out ./...
          test_status=$?
          set -e
          if [[ -f coverage.out ]]; then
            go tool cover -func=coverage.out
          else
            echo "Coverage profile was not generated."
          fi
          exit "$test_status"
