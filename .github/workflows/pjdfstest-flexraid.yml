name: pjdfstest FlexRAID

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

jobs:
  pjdfstest:
    name: FlexRAID pjdfstest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out FlexRAID
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check out pjdfstest
        uses: actions/checkout@v6
        with:
          repository: pjd/pjdfstest
          path: pjdfstest
          ref: 85a8aea9e685999ef0540392fd80535f873d7ff7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool m4 perl openssl fuse3 psmisc

      - name: Build pjdfstest
        working-directory: pjdfstest
        run: |
          set -euxo pipefail
          autoreconf -ifs
          ./configure
          make -j"$(nproc)" 2>&1 | tee ../pjdfstest-build.log
          test -x pjdfstest
          prove --version

      - name: Build FlexRAID
        run: go build -o "$RUNNER_TEMP/flexraid" ./main

      - name: Prepare FUSE storage
        run: |
          set -eu
          root="$RUNNER_TEMP/pjdfstest-flexraid"
          mkdir -p "$root/disk1" "$root/disk2" "$root/disk3" "$root/disk4" "$root/mount" "$root/logs" "$root/results"
          cat > "$root/flexraid.yaml" <<EOF
          disks:
            - "$root/disk1"
            - "$root/disk2"
            - "$root/disk3"
            - "$root/disk4"
          mountpoint: "$root/mount"
          EOF
          sudo chmod 0777 "$root" "$root/mount" "$root/logs" "$root/results"

      - name: Select pjdfstest cases for this shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          set -euo pipefail
          test_list="$RUNNER_TEMP/pjdfstest-flexraid-shard-tests.txt"
          find "$GITHUB_WORKSPACE/pjdfstest/tests" -type f -name '*.t' -print |
            sort |
            awk -v shard="$SHARD_INDEX" -v count="$SHARD_COUNT" '(NR - 1) % count == shard' > "$test_list"
          test -s "$test_list"
          printf 'pjdfstest shard %s/%s selected %s test files:\n' "$SHARD_INDEX" "$SHARD_COUNT" "$(wc -l < "$test_list")"
          cat "$test_list"
          echo "PJDFSTEST_SHARD_TEST_LIST=$test_list" >> "$GITHUB_ENV"
          echo "PJDFSTEST_SHARD_INDEX=$SHARD_INDEX" >> "$GITHUB_ENV"
          echo "PJDFSTEST_SHARD_COUNT=$SHARD_COUNT" >> "$GITHUB_ENV"

      - name: Run pjdfstest against FlexRAID as root
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_WORKSPACE,RUNNER_TEMP,PJDFSTEST_SHARD_TEST_LIST,PJDFSTEST_SHARD_INDEX,PJDFSTEST_SHARD_COUNT env FLEXRAID_BIN="$RUNNER_TEMP/flexraid" bash -c 'set -euo pipefail
            root="$RUNNER_TEMP/pjdfstest-flexraid"
            mount_dir="$root/mount"
            log_file="$root/logs/flexraid.log"
            pid_file="$root/flexraid.pid"
            result_file="$root/results/pjdfstest-shard-${PJDFSTEST_SHARD_INDEX}.log"
            mount_pid=""

            cleanup() {
              local exit_status=$?
              trap - EXIT
              cd "$root" || cd /

              if mountpoint -q "$mount_dir"; then
                if ! fusermount3 -u "$mount_dir"; then
                  echo "normal unmount failed; checking remaining users" >&2
                  fuser -vm "$mount_dir" >&2 || true
                  fusermount3 -uz "$mount_dir" || umount -l "$mount_dir" || true
                fi
              fi

              if [[ -n "$mount_pid" ]]; then
                kill -TERM "$mount_pid" 2>/dev/null || true
                for attempt in $(seq 1 10); do
                  kill -0 "$mount_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$mount_pid" 2>/dev/null; then
                  echo "FlexRAID did not stop after SIGTERM; sending SIGKILL" >&2
                  kill -KILL "$mount_pid" 2>/dev/null || true
                fi
                wait "$mount_pid" 2>/dev/null || true
              fi
              rm -f "$pid_file"
              exit "$exit_status"
            }
            trap cleanup EXIT

            "$FLEXRAID_BIN" -config "$root/flexraid.yaml" >"$log_file" 2>&1 &
            mount_pid=$!
            printf "%s\n" "$mount_pid" > "$pid_file"

            mounted=false
            for attempt in $(seq 1 30); do
              if ! kill -0 "$mount_pid" 2>/dev/null; then
                echo "FlexRAID exited before mounting" >&2
                cat "$log_file" >&2 || true
                exit 1
              fi
              if mountpoint -q "$mount_dir" && stat "$mount_dir" >/dev/null 2>&1; then
                mounted=true
                break
              fi
              sleep 1
            done
            if [ "$mounted" != true ]; then
              echo "timed out waiting for FlexRAID mount" >&2
              cat "$log_file" >&2 || true
              exit 1
            fi

            mapfile -t tests < "$PJDFSTEST_SHARD_TEST_LIST"
            printf "Running pjdfstest shard %s/%s (%s test files) on %s\n" "$PJDFSTEST_SHARD_INDEX" "$PJDFSTEST_SHARD_COUNT" "${#tests[@]}" "$mount_dir"
            cd "$mount_dir"
            set +e
            prove -v "${tests[@]}" 2>&1 | tee "$result_file"
            test_status=${PIPESTATUS[0]}
            set -e
            echo "pjdfstest shard ${PJDFSTEST_SHARD_INDEX} exit status: $test_status"
            exit "$test_status"'

      - name: Stop FlexRAID mount
        if: always()
        run: |
          set +e
          root="$RUNNER_TEMP/pjdfstest-flexraid"
          if [ -d "$root" ]; then
            cd "$root" || cd /
            if mountpoint -q "$root/mount"; then
              sudo fusermount3 -u "$root/mount" || sudo fusermount3 -uz "$root/mount" || sudo umount -l "$root/mount"
            fi
            if [ -f "$root/flexraid.pid" ]; then
              pid=$(cat "$root/flexraid.pid")
              sudo kill -TERM "$pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                sudo kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              sudo kill -KILL "$pid" 2>/dev/null || true
            fi
          fi
          echo "FlexRAID logs:"
          find "$root/logs" "$root/results" -maxdepth 1 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort || true

      - name: Upload pjdfstest logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pjdfstest-flexraid-shard-${{ matrix.shard }}-results
          path: |
            pjdfstest-build.log
            ${{ runner.temp }}/pjdfstest-flexraid/
            ${{ runner.temp }}/pjdfstest-flexraid-shard-tests.txt
          if-no-files-found: warn
          retention-days: 14
