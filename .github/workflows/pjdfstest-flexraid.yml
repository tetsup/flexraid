name: pjdfstest FlexRAID

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pjdfstest:
    name: FlexRAID pjdfstest cleanup mode ${{ matrix.cleanup_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cleanup_mode: [none, logical-only, all]
    steps:
      - name: Check out FlexRAID
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check out pjdfstest
        uses: actions/checkout@v6
        with:
          repository: pjd/pjdfstest
          path: pjdfstest
          ref: 85a8aea9e685999ef0540392fd80535f873d7ff7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool m4 perl openssl fuse3 psmisc

      - name: Build pjdfstest
        working-directory: pjdfstest
        run: |
          set -euxo pipefail
          autoreconf -ifs
          ./configure
          make -j"$(nproc)" 2>&1 | tee ../pjdfstest-build.log
          test -x pjdfstest
          prove --version

      - name: Build FlexRAID
        run: go build -o "$RUNNER_TEMP/flexraid" ./main

      - name: Prepare FUSE storage
        env:
          CLEANUP_MODE: ${{ matrix.cleanup_mode }}
        run: |
          set -eu
          root="$RUNNER_TEMP/pjdfstest-flexraid"
          mkdir -p "$root/disk1" "$root/disk2" "$root/disk3" "$root/disk4" \
            "$root/physical1" "$root/physical2" "$root/physical3" "$root/physical4" \
            "$root/mount" "$root/logs" "$root/results"
          sudo mkdir -p /dev/disk/by-id
          : > "$root/loop-devices"
          for index in 1 2 3 4; do
            truncate -s 32M "$root/loop$index.img"
            device=$(sudo losetup --find --show "$root/loop$index.img")
            echo "$device" >> "$root/loop-devices"
            sudo ln -sfn "$device" "/dev/disk/by-id/wwn-flexraid-ci-$index"
          done
          case "$CLEANUP_MODE" in
            none) delete_deprecated=false; preserve_abnormal=false; delete_objects=false ;;
            logical-only) delete_deprecated=false; preserve_abnormal=false; delete_objects=true ;;
            all) delete_deprecated=true; preserve_abnormal=true; delete_objects=true ;;
            *) echo "unknown cleanup mode: $CLEANUP_MODE" >&2; exit 1 ;;
          esac
          cat > "$root/flexraid.yaml" <<EOF
          disks:
            - root: "$root/disk1"
              mountpoint: "$root/physical1"
              wwn: flexraid-ci-1
              cleanup_delete_deprecated_versions_allowed: $delete_deprecated
              cleanup_preserve_abnormal_data_allowed: $preserve_abnormal
              cleanup_delete_logical_objects_allowed: $delete_objects
            - root: "$root/disk2"
              mountpoint: "$root/physical2"
              wwn: flexraid-ci-2
              cleanup_delete_deprecated_versions_allowed: $delete_deprecated
              cleanup_preserve_abnormal_data_allowed: $preserve_abnormal
              cleanup_delete_logical_objects_allowed: $delete_objects
            - root: "$root/disk3"
              mountpoint: "$root/physical3"
              wwn: flexraid-ci-3
              cleanup_delete_deprecated_versions_allowed: $delete_deprecated
              cleanup_preserve_abnormal_data_allowed: $preserve_abnormal
              cleanup_delete_logical_objects_allowed: $delete_objects
            - root: "$root/disk4"
              mountpoint: "$root/physical4"
              wwn: flexraid-ci-4
              cleanup_delete_deprecated_versions_allowed: $delete_deprecated
              cleanup_preserve_abnormal_data_allowed: $preserve_abnormal
              cleanup_delete_logical_objects_allowed: $delete_objects
          mountpoint: "$root/mount"
          grpc_socket_path: "$root/worker.sock"
          EOF
          sudo chmod 0777 "$root" "$root/mount" "$root/logs" "$root/results"

      - name: Select all pjdfstest cases for serial execution
        run: |
          set -euo pipefail
          test_list="$RUNNER_TEMP/pjdfstest-flexraid-tests.txt"
          find "$GITHUB_WORKSPACE/pjdfstest/tests" -type f -name '*.t' -print | sort > "$test_list"
          test -s "$test_list"
          printf 'pjdfstest selected %s test files for serial execution:\n' "$(wc -l < "$test_list")"
          cat "$test_list"
          echo "PJDFSTEST_TEST_LIST=$test_list" >> "$GITHUB_ENV"

      - name: Run pjdfstest against FlexRAID as root
        env:
          CLEANUP_MODE: ${{ matrix.cleanup_mode }}
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_WORKSPACE,RUNNER_TEMP,PJDFSTEST_TEST_LIST,CLEANUP_MODE env FLEXRAID_BIN="$RUNNER_TEMP/flexraid" bash -c 'set -euo pipefail
            root="$RUNNER_TEMP/pjdfstest-flexraid"
            mount_dir="$root/mount"
            log_file="$root/logs/flexraid.log"
            pid_file="$root/flexraid.pid"
            result_file="$root/results/pjdfstest-${CLEANUP_MODE}.log"
            mount_pid=""

            cleanup() {
              local exit_status=$?
              trap - EXIT
              cd "$root" || cd /

              if mountpoint -q "$mount_dir"; then
                if ! fusermount3 -u "$mount_dir"; then
                  echo "normal unmount failed; checking remaining users" >&2
                  fuser -vm "$mount_dir" >&2 || true
                  fusermount3 -uz "$mount_dir" || umount -l "$mount_dir" || true
                fi
              fi

              if [[ -n "$mount_pid" ]]; then
                kill -TERM "$mount_pid" 2>/dev/null || true
                for attempt in $(seq 1 10); do
                  kill -0 "$mount_pid" 2>/dev/null || break
                  sleep 1
                done
                if kill -0 "$mount_pid" 2>/dev/null; then
                  echo "FlexRAID did not stop after SIGTERM; sending SIGKILL" >&2
                  kill -KILL "$mount_pid" 2>/dev/null || true
                fi
                wait "$mount_pid" 2>/dev/null || true
              fi
              rm -f "$pid_file"
              exit "$exit_status"
            }
            trap cleanup EXIT

            "$FLEXRAID_BIN" -config "$root/flexraid.yaml" >"$log_file" 2>&1 &
            mount_pid=$!
            printf "%s\n" "$mount_pid" > "$pid_file"

            mounted=false
            for attempt in $(seq 1 30); do
              if ! kill -0 "$mount_pid" 2>/dev/null; then
                echo "FlexRAID exited before mounting" >&2
                cat "$log_file" >&2 || true
                exit 1
              fi
              if mountpoint -q "$mount_dir" && stat "$mount_dir" >/dev/null 2>&1; then
                mounted=true
                break
              fi
              sleep 1
            done
            if [ "$mounted" != true ]; then
              echo "timed out waiting for FlexRAID mount" >&2
              cat "$log_file" >&2 || true
              exit 1
            fi

            mapfile -t tests < "$PJDFSTEST_TEST_LIST"
            printf "Running pjdfstest cleanup mode %s (%s test files, serial) on %s\n" "$CLEANUP_MODE" "${#tests[@]}" "$mount_dir"
            cd "$mount_dir"
            test_status=0
            for test_file in "${tests[@]}"; do
              case_started=$(date +%s)
              relative_test=${test_file#"$GITHUB_WORKSPACE/pjdfstest/"}
              skip_reason=""
              while IFS="$(printf "\\t")" read -r skip_path skip_value; do
                if [[ "$skip_path" == "$relative_test" ]]; then
                  skip_reason="$skip_value"
                  break
                fi
              done < "$GITHUB_WORKSPACE/tools/pjdfstest-flexraid-skiplist.tsv"
              run_file="$test_file"
              if [ -n "$skip_reason" ]; then
                skip_file="$root/results/skip-${relative_test//\//_}"
                skip_file="${skip_file%.t}.t"
                printf "%s\n" "print \"1..0 # SKIP ${skip_reason}\\n\";" > "$skip_file"
                chmod +x "$skip_file"
                run_file="$skip_file"
                echo "PJDFSTEST_CASE phase=skip test=$relative_test reason=$skip_reason timestamp=$(date --iso-8601=seconds)"
              else
                echo "PJDFSTEST_CASE phase=start test=$test_file timestamp=$(date --iso-8601=seconds)"
              fi
              set +e
              prove -v "$run_file" 2>&1 | tee -a "$result_file"
              case_status=${PIPESTATUS[0]}
              set -e
              case_duration=$(( $(date +%s) - case_started ))
              echo "PJDFSTEST_CASE phase=end test=$test_file exit_status=$case_status duration_seconds=$case_duration timestamp=$(date --iso-8601=seconds)"
              if [ "$case_status" -ne 0 ]; then
                test_status=1
              fi
            done
            echo "pjdfstest cleanup mode ${CLEANUP_MODE} exit status: $test_status"
            exit "$test_status"'

      - name: Stop FlexRAID mount
        if: always()
        run: |
          set +e
          root="$RUNNER_TEMP/pjdfstest-flexraid"
          if [ -d "$root" ]; then
            cd "$root" || cd /
            if mountpoint -q "$root/mount"; then
              sudo fusermount3 -u "$root/mount" || sudo fusermount3 -uz "$root/mount" || sudo umount -l "$root/mount"
            fi
            if [ -f "$root/flexraid.pid" ]; then
              pid=$(cat "$root/flexraid.pid")
              sudo kill -TERM "$pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                sudo kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              sudo kill -KILL "$pid" 2>/dev/null || true
            fi
          fi
          for index in 1 2 3 4; do
            sudo rm -f "/dev/disk/by-id/wwn-flexraid-ci-$index"
          done
          if [ -f "$root/loop-devices" ]; then
            while read -r device; do sudo losetup -d "$device" 2>/dev/null || true; done < "$root/loop-devices"
          fi
          echo "FlexRAID logs:"
          find "$root/logs" "$root/results" -maxdepth 1 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort || true

      - name: Upload pjdfstest logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pjdfstest-flexraid-${{ matrix.cleanup_mode }}-results
          path: |
            pjdfstest-build.log
            ${{ runner.temp }}/pjdfstest-flexraid/
            ${{ runner.temp }}/pjdfstest-flexraid-tests.txt
          if-no-files-found: warn
          retention-days: 14
