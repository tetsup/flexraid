name: xfstests Generic (Exploratory)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xfstests:
    name: Run xfstests generic against FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out flexraid
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Check out xfstests
        uses: actions/checkout@v6
        with:
          repository: kdave/xfstests
          path: xfstests
          ref: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake bc gawk libaio-dev libattr1-dev libcap-dev libgdbm-dev libgdbm-compat-dev liburing-dev xfslibs-dev libtool libtool-bin libuuid1 psmisc sed sqlite3 uuid-dev xfsprogs acl attr quota python3 python3-pip fuse3

      - name: Build xfstests
        working-directory: xfstests
        run: |
          set -euxo pipefail
          # xfstests-dev is built with make; it does not have a ./configure
          # entry point. Fail this setup step rather than running tests with
          # missing helper binaries.
          make -j"$(nproc)" 2>&1 | tee ../xfstests-build.log
          test -x src/fsstress
          test -x src/fsx
          echo "xfstests build completed; fsstress and fsx are executable."

      - name: Build FlexRAID mount command
        run: go build -o "$RUNNER_TEMP/flexraid" ./main

      - name: Prepare FUSE storage and mountpoint
        run: |
          set -eu
          root="$RUNNER_TEMP/flexraid-test"
          mkdir -p "$root/disk1" "$root/disk2" "$root/disk3" "$root/disk4" "$root/mount"
          cat > "$RUNNER_TEMP/flexraid.yaml" <<EOF
          disks:
            - "$root/disk1"
            - "$root/disk2"
            - "$root/disk3"
            - "$root/disk4"
          mountpoint: "$root/mount"
          EOF
          mkdir -p xfstests/results
          sudo chmod 0777 "$root" "$root/mount"

      - name: Configure xfstests for FUSE
        working-directory: xfstests
        run: |
          cat > local.config <<EOF
          export TEST_DIR="$RUNNER_TEMP/flexraid-test/mount"
          export SCRATCH_DIR="$RUNNER_TEMP/flexraid-test/mount/xfstests-scratch"
          export FSTYP=fuse
          export RESULTS_DIR="$PWD/results"
          EOF

      - name: Start FlexRAID mount
        run: |
          set +e
          mount_dir="$RUNNER_TEMP/flexraid-test/mount"
          "$RUNNER_TEMP/flexraid" -config "$RUNNER_TEMP/flexraid.yaml" > "$RUNNER_TEMP/flexraid-mount.log" 2>&1 &
          mount_pid=$!
          echo "$mount_pid" > "$RUNNER_TEMP/flexraid.pid"
          for attempt in $(seq 1 30); do
            if mountpoint -q "$mount_dir"; then
              echo "FlexRAID mount is visible in this job's mount namespace."
              findmnt -T "$mount_dir" || true
              ls -la "$mount_dir" || true
              exit 0
            fi
            if ! kill -0 "$mount_pid" 2>/dev/null; then
              echo "FlexRAID process exited before mount became visible (pid=$mount_pid)."
              cat "$RUNNER_TEMP/flexraid-mount.log"
              exit 1
            fi
            sleep 1
          done
          echo "Mount readiness timed out; diagnostics follow."
          echo "--- mount process ---"
          ps -o pid,ppid,stat,cmd -p "$mount_pid" || true
          echo "--- mountpoint status ---"
          mountpoint "$mount_dir" || true
          echo "--- findmnt ---"
          findmnt -T "$mount_dir" || true
          echo "--- mountinfo matching mount path ---"
          grep -F "$mount_dir" /proc/self/mountinfo || true
          echo "--- mount directory ---"
          ls -lad "$mount_dir" || true
          ls -la "$mount_dir" || true
          echo "--- FUSE device ---"
          ls -l /dev/fuse || true
          echo "--- mount process log ---"
          cat "$RUNNER_TEMP/flexraid-mount.log"
          exit 1

      - name: Run generic tests (non-blocking)
        working-directory: xfstests
        continue-on-error: true
        run: |
          set +e
          # local.config is sourced by ./check, not by this Actions shell.
          # Source it here too so SCRATCH_DIR is defined for preparation.
          source ./local.config
          mkdir -p "$SCRATCH_DIR" "$RESULTS_DIR"
          set -o pipefail
          ./check -g generic 2>&1 | tee results/xfstests-generic.log
          test_status=${PIPESTATUS[0]}
          echo "xfstests generic exit status: $test_status"
          echo "$test_status" > results/xfstests-generic.exit-status
          exit 0

      - name: Stop FlexRAID mount
        if: always()
        run: |
          set +e
          mountpoint="$RUNNER_TEMP/flexraid-test/mount"
          if mountpoint -q "$mountpoint"; then
            fusermount3 -u "$mountpoint" || sudo umount "$mountpoint"
          fi
          if [ -f "$RUNNER_TEMP/flexraid.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/flexraid.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/flexraid-mount.log" 2>/dev/null || true

      - name: Upload xfstests logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xfstests-generic-results
          path: |
            xfstests/results/
            xfstests/local.config
            xfstests-build.log
            ${{ runner.temp }}/flexraid-mount.log
            ${{ runner.temp }}/flexraid.yaml
          if-no-files-found: warn
          retention-days: 14
